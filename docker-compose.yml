services:
  postgres:
    image: postgres:16
    container_name: devforces-postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devforces_code
      POSTGRES_DB: devforces
    volumes:
      - Devforce_data:/var/lib/postgresql/data
    networks:
      - devforce_network

  redis:
    image: redis:latest
    container_name: devforces-redis
    ports:
      - "6379:6379"
    volumes:
      - devForce_caching:/data
    networks:
      - devforce_network

  api:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.api
    container_name: devforces-api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
      AUTH_TOKEN: ${AUTH_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CLIENT_URL: http://localhost:3000
    depends_on:
      - postgres
      - redis
    networks:
      - devforce_network
  worker:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.worker
    container_name: devforce-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - devforce_network

  cron-worker:
    build:
       context: .
       dockerfile: Dockerfiles/Dockerfile.cron-worker
    container_name: devforce-cron-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
        - postgres
        - redis
    networks:
        - devforce_network

  realtime:
    build:
       context: .
       dockerfile: Dockerfiles/Dockerfile.realtime
    container_name: devforce-realtime
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
        - postgres
        - redis
    networks:
        - devforce_network

  web:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: devforce-web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - api
      - redis
    networks:
      - devforce_network

  leaderboard:
   build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.leaderboard
   container_name: devforce-leaderboard
   ports: ["8080:8080"]
   environment:
     DATABASE_URL: ${DATABASE_URL}
     REDIS_HOST: redis
     REDIS_PORT: 6379
   depends_on:
     - redis
     - postgres
   networks:
     - devforce_network  

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - devforce_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devforce_network

networks:
  devforce_network:
    driver: bridge

volumes:
  Devforce_data:
  devForce_caching:
  grafana_data:
